name: CI

# Three bugs reached production in one week that a linter would have caught for
# free: two "Cannot access 'x' before initialization" crashes (one of them live
# for over a week) plus undefined-identifier risks in a single 13k-line
# component. Every push and every pull request now gets linted, tested and
# built before anyone sees it.

on:
  push:
  pull_request:

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci, not npm install: it installs exactly the tree in
      # package-lock.json and fails if package.json and the lockfile disagree.
      # npm install would quietly reresolve and update the lockfile, which is
      # the behaviour that made builds non-reproducible in the first place.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Rules live in eslint.config.mjs. ESLint 9 changed the default config
      # format and ESLint 10 removed the old one, so the eslintConfig block in
      # package.json is no longer read by anything.
      #
      # The rule that matters most is no-use-before-define: it is what catches
      # the "Cannot access 'x' before initialization" crashes. It runs with
      # variables: false, which still reports a const used earlier in the SAME
      # scope — the shape of both production crashes — while allowing the
      # legitimate pattern of a callback using a ref declared further down.
      #
      # no-undef and no-dupe-keys were turned on 23 September 2026. The note
      # that used to live here listed four blockers: an undefined `v` in a
      # RecommendationsStrip handler and three duplicate object keys. All four
      # were gone — RecommendationsStrip no longer exists in the file, and the
      # duplicate keys went with the listing rewrites — so the note was
      # describing a codebase that had already moved on. Both rules now run
      # clean. no-undef needs its globals declared; they are listed inline in
      # eslint.config.mjs rather than adding the `globals` package, because
      # three direct dependencies is a record worth keeping.
      #
      # Still deliberately off:
      #  * react-hooks/exhaustive-deps — could only be a warning (13 hits,
      #    mostly intentional single-run effects), and CI=true below turns
      #    warnings into failures, so a warning would break this job and the
      #    Vercel build too.
      #  * extends: react-app — ~30 errors today (25 rules-of-hooks, 4
      #    no-restricted-globals for bare location/history). Worth doing, but as
      #    its own change, not smuggled in with something else.
      - name: Lint src/
        run: npm run lint

      # Unit tests for the pure booking rules. These are the decisions that
      # decide whether a vendor can take a booking, so a regression here is a
      # wrong booking rather than a wrong pixel.
      - name: Unit tests
        run: npm test

      # Last safety net: the same production build Vercel runs.
      - name: Production build
        run: npm run build
        env:
          CI: true

      # Browser checks (checklist item 30, added 31 Oct 2026). The production
      # build from the step above, served by `vite preview`, opened in a real
      # Chromium with the backend faked (e2e/mock.js), so nothing here reaches
      # Supabase or sends an email. Covers what broke or was built in October:
      # the footer, Spanish, one icon style, phone width, badges, the terms
      # gate on sign-up, and the page never jumping to the bottom.
      #
      # Playwright is installed with --no-save rather than listed in
      # package.json: the same pinned version every run, while package.json and
      # the lockfile stay the small tree Vercel installs. To upgrade, change
      # the version here; nothing else refers to it.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Browser checks
        run: npx playwright test

      # On failure, keep the trace (a step-by-step recording with screenshots)
      # so the broken check can be replayed instead of guessed at.
      - name: Keep the failure recordings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-traces
          path: test-results/
          retention-days: 7
