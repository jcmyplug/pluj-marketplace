<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E40FF" />

    <title>PLUJ — Book Food, Music &amp; Venues for Your Event | Houston, TX</title>
    <meta name="description" content="Build your whole event lineup in one place. Compare food trucks, DJs, venues, decor and rentals in Houston, then send every booking request at once. Free to browse." />

    <!-- Tells search engines which URL is the real one. pluj.us and the
         vercel.app domain both serve this app; without this they compete. -->
    <link rel="canonical" href="https://www.pluj.us/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph — without these a shared link renders as a bare URL with no
         title, description or image in iMessage, WhatsApp, Slack and Facebook. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PLUJ" />
    <meta property="og:url" content="https://www.pluj.us/" />
    <meta property="og:title" content="PLUJ — Book Food, Music &amp; Venues for Your Event" />
    <meta property="og:description" content="Build your whole event lineup in one place. Compare food trucks, DJs, venues, decor and rentals in Houston, then send every booking request at once." />
    <meta property="og:image" content="https://www.pluj.us/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PLUJ — Book Food, Music &amp; Venues for Your Event" />
    <meta name="twitter:description" content="Build your whole event lineup in one place, then send every booking request at once." />
    <meta name="twitter:image" content="https://www.pluj.us/og-image.png" />

    <!-- Real icon files: Google Search only shows a favicon it can fetch as a
         file at a stable URL (multiple of 48px). The inline SVG below stays as
         a fallback for browsers (inline SVG: scales cleanly, dark-mode safe). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Warm up the connections the first paint actually needs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://btmqghudfakpbbplrqhf.supabase.co" />
    <!-- Tells Google the site's name is PLUJ (shown above the result instead of
         the bare domain) and which logo belongs to the business. -->
    <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://www.pluj.us/#organization","name":"PLUJ","url":"https://www.pluj.us/","logo":"https://www.pluj.us/pluj-logo-512.png","email":"info@pluj.us","description":"Event marketplace in Houston, TX: book food trucks, DJs, venues, decor and rentals in one place.","areaServed":{"@type":"City","name":"Houston, TX"}},{"@type":"WebSite","@id":"https://www.pluj.us/#website","name":"PLUJ","url":"https://www.pluj.us/","publisher":{"@id":"https://www.pluj.us/#organization"}}]}</script>
  </head>
  <body>
    <noscript>
      PLUJ needs JavaScript to run. Please enable it, or email us and we'll help
      you book by hand.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
